<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Storefront · Virtual Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F5EE;
  --card:#FFFFFF;
  --rule:#DBDECB;
  --ink:#182219;
  --ink2:#4A5548;
  --green:#1B7A4A;
  --green-deep:#0C3B24;
  --green-soft:#E4F0E7;
  --red:#B23A2E;
  --red-soft:#F7E7E4;
  --gold:#C79A2A;
  --disp:"Bricolage Grotesque",sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:var(--body);cursor:pointer}
input,select{font-family:var(--body)}
a{color:var(--green-deep)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.02em;cursor:pointer;user-select:none}
.brand small{display:block;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--green)}
.top nav{display:flex;gap:6px;margin-left:auto}
.navbtn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}
.navbtn.on{background:var(--ink);color:var(--paper)}
.bizpick{display:flex;align-items:center;gap:8px;width:100%;padding-top:2px}
.bizpick label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2)}
.bizpick select{flex:1;max-width:340px;border:1.5px solid var(--ink);border-radius:8px;padding:6px 8px;background:var(--card);font-weight:600;font-size:14px;color:var(--ink)}

/* home hero */
.hero{padding:44px 0 26px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--green);margin-bottom:10px}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(42px,9vw,72px);line-height:.95;letter-spacing:-.01em}
.hero p{margin-top:14px;max-width:520px;color:var(--ink2);font-size:17px}
.hero .cta{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}

/* ledger index of days */
.unitlabel{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0 10px;flex-wrap:wrap;gap:6px}
.unitlabel h2{font-family:var(--disp);font-weight:800;font-size:22px}
.unitlabel span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.ledger{border-top:2px solid var(--ink)}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--rule);cursor:pointer;background:transparent;transition:background .12s}
.lrow:hover{background:#EDEFE3}
.lrow .dnum{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink2);letter-spacing:.06em}
.lrow .dtitle{font-weight:700;font-size:16px}
.lrow .dsub{font-family:var(--mono);font-size:10.5px;color:var(--ink2);letter-spacing:.04em;margin-top:2px}
.lrow .dstat{font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.done .dstat{color:var(--green);font-weight:600}
.lockedrow{opacity:.45;cursor:default}

/* generic card + lesson layout */
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:22px;margin:16px 0;box-shadow:3px 3px 0 rgba(24,34,25,.12)}
.card h3{font-family:var(--disp);font-weight:800;font-size:20px;margin-bottom:10px}
.card p{margin:8px 0;font-size:16.5px}
.card p.big{font-size:19px;font-weight:600}
.klist{margin:10px 0 4px 0;padding-left:0;list-style:none}
.klist li{padding:7px 0 7px 26px;position:relative;font-size:16.5px}
.klist li::before{content:"";position:absolute;left:4px;top:14px;width:10px;height:10px;border-radius:2px;background:var(--green)}
.term{background:var(--green-soft);border-radius:4px;padding:1px 6px;font-weight:700}
.money{font-family:var(--mono);font-weight:600;white-space:nowrap}

/* lesson header + progress */
.lhead{padding:26px 0 8px}
.lhead .eyebrow{margin-bottom:6px}
.lhead h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1}
.teks{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;border:1px solid var(--ink);border-radius:999px;padding:4px 10px;color:var(--ink2)}
.steps{display:flex;gap:4px;margin:18px 0 4px;flex-wrap:wrap}
.stepdot{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;border:1.5px solid var(--rule);color:var(--ink2);background:var(--card)}
.stepdot.now{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.stepdot.past{border-color:var(--green);color:var(--green)}
.secbar{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.secbar h2{font-family:var(--disp);font-weight:800;font-size:24px}
.secbar .mins{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.1em}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;padding:11px 20px;border-radius:10px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:default}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}

/* question blocks */
.q{margin:14px 0 4px;font-weight:700;font-size:16.5px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:1.5px solid var(--ink);border-radius:10px;background:var(--card);padding:11px 14px;text-align:left;font-size:15.5px;font-weight:600;color:var(--ink);transition:background .1s}
.opt:hover{background:#F0F2E8}
.opt.chosen{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.subrow{margin-top:10px}
.btn.sm{font-size:13.5px;padding:8px 16px}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-weight:600;font-size:14.5px}
.fb.ok{color:var(--green-deep)}
.fb.no{color:var(--red)}
.hint{margin-top:8px;font-size:14px;color:var(--ink2);border-left:3px solid var(--gold);padding-left:10px}

/* sort game */
.chipbank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;color:var(--ink)}
.chip.gone{display:none}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.buckets{grid-template-columns:1fr}}
.bucket{border:2px dashed var(--ink2);border-radius:12px;min-height:86px;padding:10px}
.bucket h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink2);margin-bottom:6px}
.bucket .placed{display:flex;flex-wrap:wrap;gap:6px}
.placed span{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.placed span.ok{background:var(--green-soft);color:var(--green-deep)}
.placed span.no{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.sortnow{border:2px solid var(--ink);border-radius:12px;padding:16px;text-align:center;margin:12px 0;background:#FBFBF6}
.sortnow .item{font-family:var(--disp);font-weight:800;font-size:22px}
.sortnow .val{font-family:var(--mono);font-weight:600;color:var(--ink2);margin-top:2px}
.bucketbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.score{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink2);margin-top:10px}
.streak{color:var(--gold);font-weight:600}

/* numeric input */
.numrow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.numrow .dollar{font-family:var(--mono);font-weight:600;font-size:18px}
.numin{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-weight:600;font-size:17px;width:150px;background:var(--card);color:var(--ink)}
.numin:focus{outline:3px solid var(--green-soft)}

/* transaction picker */
.txcard{border:1.5px solid var(--ink);border-radius:12px;padding:16px;margin:14px 0;background:#FBFBF6}
.txcard .txd{font-weight:700;font-size:16px}
.txcard .txm{font-family:var(--mono);color:var(--green-deep);font-weight:600}
.pickrow{margin-top:12px}
.pickrow h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:6px;color:var(--ink2)}
.acctchips{display:flex;flex-wrap:wrap;gap:7px}
.acct{border:1.5px solid var(--ink2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.acct.selup{background:var(--green);border-color:var(--green);color:#fff}
.acct.seldn{background:var(--red);border-color:var(--red);color:#fff}
.acct.none{border-style:dashed}

/* ledger record box */
.record{position:relative;border:1.5px solid var(--green-deep);border-radius:12px;margin:18px 0;padding:16px 16px 16px 42px;background:
  repeating-linear-gradient(180deg,#FDFDF8 0px,#FDFDF8 27px,#E7ECDC 28px);overflow:hidden}
.record::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--red)}
.record h4{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--green-deep);margin-bottom:6px}
.record .rline{font-family:var(--mono);font-weight:600;font-size:14.5px;line-height:28px;color:var(--ink)}

/* stamp */
.stampwrap{position:relative;min-height:120px;display:flex;align-items:center;justify-content:center;margin:10px 0}
.stamp{font-family:var(--disp);font-weight:800;letter-spacing:.08em;font-size:30px;color:var(--green);border:4px solid var(--green);border-radius:10px;padding:10px 22px;transform:rotate(-7deg);opacity:0}
.stamp.red{color:var(--red);border-color:var(--red)}
.stamp.show{animation:slam .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:rotate(-7deg) scale(2.4)}70%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-7deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp.show{animation:none;opacity:1}}

/* business cards */
.picklist{margin-top:14px}
.pickrow2{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.pickrow2 .mchip{margin-bottom:0}
.pname{font-family:var(--disp);font-weight:800;font-size:17px}
.pdoes{font-size:13.5px;color:var(--ink2);margin-top:2px}
.pprice{font-family:var(--mono);font-size:12.5px;color:var(--green-deep);font-weight:600;margin-top:4px}
.opsblock{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.olabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--green);margin:10px 0 4px}
.opsblock p{font-size:14px;line-height:1.5;margin-bottom:5px}
.pickcard .story{margin-top:10px}
.pickcard .story p{font-size:14px;line-height:1.55;color:var(--ink2);margin-bottom:7px}
.bizgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:600px){.bizgrid{grid-template-columns:1fr}}
.bizcard{border:1.5px solid var(--ink);border-radius:14px;background:var(--card);padding:16px;position:relative;box-shadow:3px 3px 0 rgba(24,34,25,.12)}
.bizcard.taken{outline:3px solid var(--green)}
.mono{font-family:var(--mono)}
.mchip{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:17px;color:#fff;margin-bottom:10px}
.bizcard h3{font-family:var(--disp);font-weight:800;font-size:18px}
.bizcard .who{font-size:13.5px;color:var(--ink2);font-weight:600;margin-top:2px}
.bizcard .tag{font-size:14px;margin-top:8px}
.bizcard .story{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.bizcard .story p{font-size:13.5px;line-height:1.5;color:var(--ink2);margin-bottom:6px}
.bizcard .price{font-family:var(--mono);font-size:12.5px;margin-top:8px;color:var(--green-deep);font-weight:600}
.grouptag{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:var(--green);color:#fff;border-radius:999px;padding:4px 10px;font-weight:600}
.drawpanel{border:2px solid var(--ink);border-radius:14px;padding:20px;margin-top:20px;background:var(--card);text-align:center}
.drawpanel h3{font-family:var(--disp);font-weight:800;font-size:22px}
.hl{outline:3px solid var(--gold)}

/* exit / results */
.result{border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper);padding:26px;text-align:center;margin:18px 0}
.result .bignum{font-family:var(--disp);font-weight:800;font-size:56px;line-height:1}
.result .sub{font-family:var(--mono);font-size:12px;letter-spacing:.12em;margin-top:8px;color:#C9D2C6}
.result .bizline{margin-top:10px;font-weight:600}

.footer{border-top:2px solid var(--ink);margin-top:40px;padding:18px 0;font-family:var(--mono);font-size:11px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.footer button{background:none;border:none;color:var(--ink2);font-family:var(--mono);font-size:11px;text-decoration:underline;padding:0}
.tnote{font-size:14.5px;color:var(--ink2);margin:8px 0}
.warnpick{border:2px solid var(--gold);background:#FBF4DF;border-radius:12px;padding:14px 16px;margin:14px 0;font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.resultform{margin-top:16px;text-align:left}
.resultform label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#C9D2C6;display:block;margin-bottom:4px}
.namein{width:100%;max-width:320px;border:2px solid var(--paper);border-radius:8px;padding:9px 11px;font-weight:600;font-size:15px;background:#fff;color:var(--ink)}
.copyta{width:100%;margin-top:12px;border:1.5px solid #5A665B;border-radius:8px;background:#0F1710;color:#D9E2D6;font-family:var(--mono);font-size:12px;line-height:1.5;padding:10px;resize:none}
.fslink{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;border:1.5px solid var(--ink);border-radius:999px;padding:5px 10px;background:transparent;color:var(--ink);text-decoration:none;font-weight:600}
</style>
</head>

/* derived store math */
function r2(n){return Math.round(n*100)/100}
function ppu(b){return b.p-b.c}
function be(b){return b.f/ppu(b)}
function rev(b,u){return b.p*u}
function profAt(b,u){return u*ppu(b)-b.f}
function marg(b){return Math.round(ppu(b)/b.p*1000)/10}
function fixSum(b){return b.fixed.reduce(function(t,x){return t+x.v},0)}
function fm(n){var o={maximumFractionDigits:2};if(n%1!==0)o.minimumFractionDigits=2;return "$"+n.toLocaleString("en-US",o)}

/* block constructors */
function T(h,lines,check){return {t:"teach",h:h,lines:lines,check:check||null}}
function Q(q,o,a,why){return {q:q,o:o,a:a,why:why||""}}
function M(title,qs){return {t:"mcq",title:title,qs:qs}}
function S(title,prompt,buckets,items){return {t:"sort",title:title,prompt:prompt,buckets:buckets,items:items}}
function N(prompt,ans,why){return {t:"num",prompt:prompt,ans:ans,why:why||""}}
function TXB(title,txs,note){return {t:"tx",title:title,txs:txs,note:note||""}}
function R(lines){return {t:"record",lines:lines}}
function P(txt){return {t:"note",txt:txt}}
function STAMP(label){return {t:"stamp",label:label}}
function PICK(){return {t:"pick"}}

function ownerOpts(b){var o=[b.owner];BIZ.forEach(function(x){if(x.id!==b.id&&o.length<4)o.push(x.owner)});return o}
function priceOpts(b){var o=[b.price];BIZ.forEach(function(x){if(x.id!==b.id&&o.length<4)o.push(x.price)});return o}
function doesOpts(b){var o=[b.does];BIZ.forEach(function(x){if(x.id!==b.id&&o.length<4)o.push(x.does)});return o}
function modelOpts(b){var o=[b.model];BIZ.forEach(function(x){if(x.model!==b.model&&o.indexOf(x.model)<0&&o.length<4)o.push(x.model)});return o}

function shuf(a){var c=a.slice();for(var i=c.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=c[i];c[i]=c[j];c[j]=t}return c}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

  var h=location.hash||"#/";

}

/* ---------- lesson flow ---------- */
function daySecs(D){
  var out=[];
  D.parts.forEach(function(pi,idx){
    LESSONS[pi].secs.forEach(function(s){
      if(idx>0&&s.name==="Warm-Up")return;
      if(idx<D.parts.length-1&&s.name==="Exit")return;
      out.push(s);
    });
  });
  return out;
}

function vcode(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0}return ("0000"+h.toString(36).toUpperCase()).slice(-4)}

    if(navigator.clipboard&&navigator.clipboard.writeText){

function qNode(q,onDone){
  var wrap=el("div","");
  wrap.appendChild(el("div","q",esc(q.q)));
  var opts=el("div","opts");
  var attempts=0,settled=false,picked=null,pickedBtn=null;
  var options=shuf(q.o.map(function(t,i){return {t:t,ok:i===q.a}}));
  var fb=el("div","fb");
  var sub=el("button","btn green sm","Submit");
  sub.disabled=true;
  var subrow=el("div","subrow");subrow.appendChild(sub);
  options.forEach(function(o){
    var b=el("button","opt",esc(o.t));
    b.onclick=function(){
      if(settled||b.disabled)return;
      Array.prototype.forEach.call(opts.children,function(x){x.classList.remove("chosen")});
      b.classList.add("chosen");
      picked=o;pickedBtn=b;
      sub.disabled=false;
      fb.className="fb";fb.textContent="";
    };
    opts.appendChild(b);
  });
  sub.onclick=function(){
    if(settled||!picked)return;
    attempts++;
    if(picked.ok){
      settled=true;
      pickedBtn.classList.remove("chosen");pickedBtn.classList.add("right");
      fb.className="fb ok";fb.textContent="Correct.";
      scoreQ(attempts===1);
      Array.prototype.forEach.call(opts.children,function(x){x.disabled=true});
      sub.disabled=true;sub.style.display="none";
      onDone();
    }else{
      pickedBtn.classList.remove("chosen");pickedBtn.classList.add("wrong");
      pickedBtn.disabled=true;
      picked=null;pickedBtn=null;sub.disabled=true;
      if(attempts===1){
        fb.className="fb no";fb.textContent="Incorrect. Select another answer and submit again.";
        if(q.why)wrap.insertBefore(el("div","hint",esc(q.why)),fb);
      }else{
        settled=true;
        options.forEach(function(oo,ii){if(oo.ok)opts.children[ii].classList.add("right")});
        Array.prototype.forEach.call(opts.children,function(x){x.disabled=true});
        fb.className="fb no";fb.textContent="Incorrect. The correct answer is shown above.";
        sub.style.display="none";
        scoreQ(false);
        onDone();
      }
    }
  };
  wrap.appendChild(opts);wrap.appendChild(subrow);wrap.appendChild(fb);
  return wrap;
}
function rMcq(bl){
  var c=el("div","card");
  c.appendChild(el("h3","",esc(bl.title)));

function rSort(bl){
  var c=el("div","card");
  c.appendChild(el("h3","",esc(bl.title)));
  c.appendChild(el("p","",esc(bl.prompt)));
  var items=shuf(bl.items);
  var idx=0,streak=0,first=0;
  var stage=el("div","sortnow");
  var buckets=el("div","buckets");
  var lists=[];
  bl.buckets.forEach(function(bn){
    var bu=el("div","bucket");bu.appendChild(el("h4","",esc(bn.toUpperCase())));
    var pl=el("div","placed");bu.appendChild(pl);lists.push(pl);buckets.appendChild(bu);
  });
  var scoreLine=el("div","score","");
  var row=el("div","btnrow");var nx=contBtn();nx.disabled=true;row.appendChild(nx);
  function paint(){
    if(idx>=items.length){
      stage.innerHTML='<div class="item">Done.</div><div class="val">'+first+" of "+items.length+" correct.</div>";
      nx.disabled=false;scoreLine.textContent="";return;
    }
    var it=items[idx];
    stage.innerHTML='<div class="item">'+esc(it.t)+'</div>'+(it.v!==undefined?'<div class="val">'+fm(it.v)+"</div>":"");
    var bb=el("div","bucketbtns");
    bl.buckets.forEach(function(bn,bi){
      var b=el("button","btn ghost sm",esc(bn));
      b.onclick=function(){
        var ok=(bi===it.b);
        scoreQ(ok);
        if(ok){first++;streak++;
          var tag=el("span","ok",esc(it.t));lists[it.b].appendChild(tag);
        }else{streak=0;
          var tag2=el("span","no",esc(it.t));lists[it.b].appendChild(tag2);
        }
        scoreLine.innerHTML="SCORE "+first+"/"+items.length+(streak>1?' &middot; <span class="streak">STREAK &times;'+streak+"</span>":"");
        idx++;paint();
      };
      bb.appendChild(b);
    });
    stage.appendChild(bb);
  }
  c.appendChild(stage);c.appendChild(buckets);c.appendChild(scoreLine);c.appendChild(row);
  paint();
  return c;
}
function rNum(bl){
  var c=el("div","card");
  c.appendChild(el("div","q",esc(bl.prompt)));
  var nr=el("div","numrow");
  nr.appendChild(el("span","dollar","$"));
  var inp=el("input","numin");inp.type="text";inp.inputMode="numeric";inp.placeholder="0";
  nr.appendChild(inp);
  var ck=el("button","btn sm","Check");nr.appendChild(ck);
  c.appendChild(nr);
  var fb=el("div","fb");c.appendChild(fb);
  var row=el("div","btnrow");var nx=contBtn();nx.disabled=true;row.appendChild(nx);c.appendChild(row);
  var attempts=0,settled=false;
  function submit(){
    if(settled)return;
    var raw=inp.value.replace(/[$,\s]/g,"");
    if(raw==="")return;
    var vnum=Number(raw);
    attempts++;
    if(Math.abs(vnum-bl.ans)<0.005){
      settled=true;fb.className="fb ok";
      fb.textContent="Correct.";
      scoreQ(attempts===1);inp.disabled=true;ck.disabled=true;nx.disabled=false;
    }else{
      fb.className="fb no";fb.textContent="Not it. Check the math and try again.";
      if(attempts===2&&bl.why){c.insertBefore(el("div","hint",esc(bl.why)),row)}
      if(attempts>=3){
        settled=true;fb.className="fb no";
        fb.textContent="The answer is "+fm(bl.ans)+". "+(bl.why||"");
        scoreQ(false);inp.disabled=true;ck.disabled=true;nx.disabled=false;
      }
    }
  }
  ck.onclick=submit;
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")submit()});
  return c;
}

function txCard(tx,onDone){
  var cap=tx.cap||"Owner, Capital";
  var ACC=["Cash","Supplies","Equipment","Accounts Payable",cap];
  var card=el("div","txcard");
  card.appendChild(el("div","txd",esc(tx.d)));
  var sel={up:{},dn:{}};
  var attempts=0,settled=false;
  function chipRow(label,key){
    var pr=el("div","pickrow");
    pr.appendChild(el("h5","",label));
    var ch=el("div","acctchips");
    ACC.forEach(function(a){
      var b=el("button","acct",esc(a));
      b.onclick=function(){
        if(settled)return;
        sel[key][a]=!sel[key][a];
        if(sel[key][a]){b.classList.add(key==="up"?"selup":"seldn");sel[key]["__none__"]=false;
          var nb=ch.querySelector(".none");if(nb)nb.classList.remove(key==="up"?"selup":"seldn");}
        else{b.classList.remove("selup","seldn")}
      };
      ch.appendChild(b);
    });
    var nb=el("button","acct none","Nothing");
    nb.onclick=function(){
      if(settled)return;
      var on=!sel[key]["__none__"];
      ACC.forEach(function(a){sel[key][a]=false});
      Array.prototype.forEach.call(ch.children,function(x){x.classList.remove("selup","seldn")});
      sel[key]["__none__"]=on;
      if(on)nb.classList.add(key==="up"?"selup":"seldn");
    };
    ch.appendChild(nb);
    pr.appendChild(ch);
    return pr;
  }
  var upRow=chipRow("WHAT GOES UP","up");
  var dnRow=chipRow("WHAT GOES DOWN","dn");
  card.appendChild(upRow);card.appendChild(dnRow);
  var fb=el("div","fb");card.appendChild(fb);
  var ck=el("button","btn sm","Check this one");ck.style.marginTop="12px";
  card.appendChild(ck);
  function picked(key){return ACC.filter(function(a){return sel[key][a]})}
  function rowOK(key,ans){
    var p=picked(key);
    if(ans.length===0){return p.length===0&&sel[key]["__none__"]===true}
    if(p.length!==ans.length)return false;
    for(var i=0;i<ans.length;i++){if(p.indexOf(ans[i])<0)return false}
    return true;
  }
  function reveal(){
    ACC.forEach(function(a){sel.up[a]=tx.up.indexOf(a)>=0;sel.dn[a]=tx.down.indexOf(a)>=0});
    sel.up["__none__"]=tx.up.length===0;sel.dn["__none__"]=tx.down.length===0;
    [upRow,dnRow].forEach(function(rw,ri){
      var key=ri===0?"up":"dn";var ans=ri===0?tx.up:tx.down;
      Array.prototype.forEach.call(rw.querySelectorAll(".acct"),function(b){
        b.classList.remove("selup","seldn");
        var isNone=b.classList.contains("none");
        var on=isNone?(ans.length===0):(ans.indexOf(b.textContent)>=0);
        if(on)b.classList.add(key==="up"?"selup":"seldn");
      });
    });
  }
  ck.onclick=function(){
    if(settled)return;
    var upEmptyPick=picked("up").length===0&&!sel.up["__none__"];
    var dnEmptyPick=picked("dn").length===0&&!sel.dn["__none__"];
    if(upEmptyPick||dnEmptyPick){fb.className="fb no";fb.textContent="Make a pick in both rows. Tap Nothing if nothing moves.";return}
    attempts++;
    var u=rowOK("up",tx.up),d=rowOK("dn",tx.down);
    if(u&&d){
      settled=true;fb.className="fb ok";
      fb.textContent="Correct.";
      scoreQ(attempts===1);ck.disabled=true;onDone();
    }else{
      fb.className="fb no";
      fb.textContent=!u&&!d?"Look again at both rows.":(!u?"Look again at what goes up.":"Look again at what goes down.");
      if(attempts>=3){
        settled=true;reveal();
        fb.className="fb no";fb.textContent="Here is the correct move. Study it before you continue.";
        scoreQ(false);ck.disabled=true;onDone();
      }
    }
  };
  return card;
}
